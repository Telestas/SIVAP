# Compila el APK de campo y lo publica como release del repositorio.
#
# NO usa GitHub Packages: ese registro solo admite npm, Maven, NuGet,
# RubyGems, Gradle y contenedores. Un .apk no cabe ahí. Lo que corresponde
# para un binario suelto son las releases.
#
#   gh workflow run apk.yml -f version=0.1.0
#
# O empujando una etiqueta:  git tag v0.1.0 && git push origin v0.1.0

name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (sin la v). Ej.: 0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Determinar versión
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "numero=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "numero=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # `--org` fija el identificador de aplicación en cu.sivap.sivap.
      # Cambiarlo después convierte esto en otra app a ojos de Android: los
      # usuarios tendrían que desinstalar, y al desinstalar se pierde la clave
      # de cifrado del dispositivo y con ella los datos sin sincronizar.
      - name: Generar andamiaje de plataforma
        working-directory: app
        run: |
          flutter create --platforms=android --org cu.sivap .
          rm -f test/widget_test.dart

      - name: Resolver dependencias
        working-directory: app
        run: flutter pub get

      # Se analiza antes de compilar: no tiene sentido repartir un APK de un
      # código que no pasa su propio análisis.
      - name: Analizar
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Probar
        working-directory: app
        run: flutter test

      # Se compilan dos APK, y la razón es el ancho de banda del equipo.
      #
      # El APK universal lleva las bibliotecas nativas de las tres
      # arquitecturas y pesa unos 68 MB. A la velocidad de conexión con la que
      # trabaja el equipo eso es media hora por teléfono. El de arm64 pesa un
      # tercio y sirve para prácticamente cualquier teléfono de los últimos
      # años; el universal queda como red de seguridad para el que no instale.
      - name: Compilar APK
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.numero }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"

          mkdir -p build/entrega
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "build/entrega/sivap-$VERSION-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/entrega/sivap-$VERSION-universal.apk"
          ls -la build/entrega

      # ── Firma ────────────────────────────────────────────────────────
      #
      # Si no hay llavero en los secretos, el APK sale firmado con la clave de
      # depuración que genera Flutter. Se instala igual, pero NO sirve para
      # repartir de verdad: el día que se pase a una clave propia, Android lo
      # tratará como otra aplicación y cada usuario tendrá que desinstalar la
      # anterior. Al desinstalar se borra la clave del Keystore, y con ella
      # todo lo que hubiera capturado y no sincronizado.
      #
      # Conclusión práctica: crear el llavero ANTES de que nadie capture un
      # solo dato real. Ver docs/DISTRIBUCION.md.
      # El `env` de un paso NO está disponible en el `if` de ese mismo paso: la
      # condición se evalúa antes. Escrito así, la firma se saltaba siempre —
      # incluso con el secreto configurado— y la release decía «clave de
      # depuración» sin que nadie entendiera por qué. Se comprueba en un paso
      # aparte, cuya salida sí se puede consultar.
      # Los cuatro secretos van juntos o no va ninguno.
      #
      # Si el llavero está pero falta la contraseña o el alias, esto **corta la
      # compilación** en vez de continuar. La alternativa sería seguir y
      # publicar un APK firmado con la clave de depuración mientras el equipo
      # cree que va firmado con el llavero del estudio, y ese equívoco solo se
      # descubriría el día que hiciera falta actualizar la app.
      - name: ¿Hay llavero del estudio?
        id: llavero
        env:
          LLAVERO: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CLAVE_LLAVERO: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLAVE_ALIAS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          faltan=''
          [ -z "$LLAVERO" ]       && faltan="$faltan ANDROID_KEYSTORE_BASE64"
          [ -z "$CLAVE_LLAVERO" ] && faltan="$faltan ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ]         && faltan="$faltan ANDROID_KEY_ALIAS"
          [ -z "$CLAVE_ALIAS" ]   && faltan="$faltan ANDROID_KEY_PASSWORD"

          if [ -z "$faltan" ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"
            echo 'Se firmará con el llavero del estudio.'
          elif [ -z "$LLAVERO" ] && [ -z "$CLAVE_LLAVERO" ] \
            && [ -z "$ALIAS" ] && [ -z "$CLAVE_ALIAS" ]; then
            echo 'hay=no' >> "$GITHUB_OUTPUT"
            echo "::warning::Sin llavero configurado: el APK saldrá firmado con la clave de depuración. Sirve para probar, no para repartir."
          else
            echo "::error::Configuración de firma a medias. Faltan:$faltan"
            echo "Añádalos con: gh secret set <NOMBRE> --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Firmar con el llavero del estudio
        id: firma
        if: steps.llavero.outputs.hay == 'si'
        env:
          LLAVERO: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: app
        run: |
          echo "$LLAVERO" | base64 -d > /tmp/sivap.jks
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in build/entrega/*.apk; do
            "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" /tmp/alineado.apk
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/sivap.jks \
              --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
              --out "$APK" /tmp/alineado.apk

            # Comprobar que el resultado NO va firmado con la clave de
            # depuración. Si el llavero no se hubiera aplicado por lo que fuera,
            # el APK saldría instalable igual y nadie lo notaría hasta la
            # primera actualización, cuando ya es tarde.
            certs=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
            echo "$certs"
            if echo "$certs" | grep -qi 'CN=Android Debug'; then
              echo "::error::$APK quedó firmado con la clave de depuración"
              exit 1
            fi
          done
          rm -f /tmp/sivap.jks /tmp/alineado.apk

      # El SHA-256 va en la release para que quien descargue pueda comprobar
      # que el archivo llegó entero. Con una conexión que se corta, una
      # descarga a medias produce un error de instalación que no dice lo que
      # pasa.
      - name: Huellas y tamaños
        id: apk
        working-directory: app
        env:
          VERSION: ${{ steps.version.outputs.numero }}
        run: |
          {
            echo "arm64_nombre=sivap-$VERSION-arm64.apk"
            echo "arm64_sha=$(sha256sum "build/entrega/sivap-$VERSION-arm64.apk" | cut -d' ' -f1)"
            echo "arm64_tam=$(du -h "build/entrega/sivap-$VERSION-arm64.apk" | cut -f1)"
            echo "univ_nombre=sivap-$VERSION-universal.apk"
            echo "univ_sha=$(sha256sum "build/entrega/sivap-$VERSION-universal.apk" | cut -d' ' -f1)"
            echo "univ_tam=$(du -h "build/entrega/sivap-$VERSION-universal.apk" | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.numero }}
          name: SIVAP ${{ steps.version.outputs.numero }}
          files: app/build/entrega/*.apk
          # Todo lo de esta fase es preliminar: sin aprobación del CEI no se
          # enrolan pacientes reales.
          prerelease: true
          body: |
            **Versión de prueba. No para pacientes reales.**

            El estudio no tiene aprobación del CEI, así que la app arranca en
            modo demostración: los pacientes que aparecen son inventados y la
            base de datos que usa es un archivo aparte del de producción.

            ### Cuál descargar

            | Archivo | Tamaño | Para quién |
            |---|---|---|
            | `${{ steps.apk.outputs.arm64_nombre }}` | ${{ steps.apk.outputs.arm64_tam }} | **Empiece por este.** Vale para prácticamente cualquier teléfono de los últimos años |
            | `${{ steps.apk.outputs.univ_nombre }}` | ${{ steps.apk.outputs.univ_tam }} | Solo si el anterior dice «no se instaló la aplicación» |

            El primero pesa un tercio porque lleva solo las bibliotecas del
            procesador más común. Con una conexión lenta, la diferencia son
            veinte minutos por teléfono.

            Firma: ${{ steps.llavero.outputs.hay == 'si' && 'llavero del estudio' || '⚠️ clave de depuración' }}

            ${{ steps.llavero.outputs.hay == 'si' && ' ' || '> **Firmado con la clave de depuración.** Sirve para probar la app y validar los formularios. Antes de que nadie capture datos que quiera conservar, hay que crear el llavero del estudio: al cambiar de clave, Android trata la app como otra distinta, obliga a desinstalar, y al desinstalar se pierde la clave de cifrado del dispositivo con todo lo que no se hubiera sincronizado. Instrucciones en `docs/DISTRIBUCION.md`.' }}

            ### Instalación

            Android bloquea por defecto la instalación fuera de Play Store.
            Al abrir el archivo, el teléfono ofrecerá permitirlo para la app
            desde la que se descargó; hay que aceptarlo una vez.

            ### Comprobar que el archivo llegó entero

            Con una conexión inestable, una descarga a medias produce errores
            que no dicen lo que pasa. En el teléfono, con cualquier app de
            checksum, o en un ordenador:

            ```
            sha256sum sivap-*.apk
            ```

            | Archivo | SHA-256 |
            |---|---|
            | `${{ steps.apk.outputs.arm64_nombre }}` | `${{ steps.apk.outputs.arm64_sha }}` |
            | `${{ steps.apk.outputs.univ_nombre }}` | `${{ steps.apk.outputs.univ_sha }}` |

      - uses: actions/upload-artifact@v4
        with:
          name: sivap-${{ steps.version.outputs.numero }}
          path: app/build/entrega/*.apk
          retention-days: 90
