# Analiza y prueba la app sin necesidad de tener Flutter instalado.
#
# Existe porque la conexión del equipo no da para descargar 1,5 GB de SDK. El
# análisis corre aquí y los errores se leen en el registro de la ejecución:
#
#   gh workflow run verificar.yml
#   gh run watch
#   gh run view --log-failed

name: Verificar

on:
  push:
    paths:
      - 'app/**'
      - 'api/**'
      - 'firebase/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/verificar.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'api/**'
      - 'firebase/**'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

concurrency:
  # Un push nuevo cancela el análisis del anterior: no interesa el resultado
  # de un commit ya superado.
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      # El repositorio no versiona android/, ios/ ni web/: los genera Flutter.
      # `--org` fija el identificador de aplicación (cu.sivap.sivap). Cambiarlo
      # más adelante crea una app distinta a ojos de Android, así que conviene
      # decidirlo antes de repartir nada.
      - name: Generar andamiaje de plataforma
        run: tool/preparar_android.sh android,web

      - name: Resolver dependencias
        run: flutter pub get

      # `continue-on-error` a propósito: si el análisis corta el trabajo, no se
      # ven los fallos de las pruebas y hay que esperar otra vuelta entera.
      # Interesa la lista completa de una sola vez.
      - name: Analizar
        id: analizar
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Probar
        id: probar
        continue-on-error: true
        run: flutter test --reporter expanded

      - name: Compilar panel web
        id: web
        continue-on-error: true
        run: flutter build web --release

      - name: Guardar panel web
        if: steps.web.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sivap-web-${{ github.sha }}
          path: app/build/web
          retention-days: 7

      - name: Resultado
        run: |
          echo "análisis: ${{ steps.analizar.outcome }}"
          echo "pruebas:  ${{ steps.probar.outcome }}"
          echo "web:      ${{ steps.web.outcome }}"
          if [ "${{ steps.analizar.outcome }}" != "success" ] \
          || [ "${{ steps.probar.outcome }}" != "success" ] \
          || [ "${{ steps.web.outcome }}" != "success" ]; then
            exit 1
          fi

  # ── Esquema central ────────────────────────────────────────────────
  #
  # Comprueba que la migración corre sobre PostgreSQL de verdad y que las
  # garantías que promete el esquema se cumplen: auditoría de solo inserción,
  # imposibilidad de que dos pacientes ocupen la misma posición de la secuencia,
  # y que el analista no puede leer la identidad de los pacientes.
  esquema:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verificacion
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      PGPASSWORD: verificacion
      PGHOST: localhost
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Aplicar las migraciones
        run: |
          for m in api/migraciones/*.sql; do
            echo "→ $m"
            psql -v ON_ERROR_STOP=1 -q -f "$m"
          done

      - name: Comprobar las garantías del esquema
        run: |
          salida=$(psql -v ON_ERROR_STOP=1 -q -f api/pruebas/esquema_test.sql 2>&1)
          echo "$salida"
          # Cada prueba emite un NOTICE «OK ·». Si alguna falla, psql aborta;
          # si alguien borra una prueba sin querer, esto lo detecta.
          comprobadas=$(echo "$salida" | grep -c 'OK ·' || true)
          echo "garantías comprobadas: $comprobadas"
          test "$comprobadas" -ge 14

  # ── Servicio de la api ─────────────────────────────────────────────
  #
  # Contra PostgreSQL de verdad, no contra un doble: el esquema hace valer
  # garantías que ningún simulacro reproduce —disparadores, restricción de
  # solapamiento de tramos, privilegios por rol—, y probar contra otra cosa
  # daría una confianza que no existe.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verificacion
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:verificacion@localhost:5432/postgres

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -e '.[pruebas]'

      - name: Probar
        run: python -m pytest pruebas -q

  # Las reglas son la frontera de seguridad de los clientes que hablan
  # directamente con Firestore. Se prueban con el emulador, sin usar ni alterar
  # la base real del estudio.
  reglas_firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar el verificador de reglas
        working-directory: firebase
        run: npm install --no-audit --no-fund

      - name: Probar reglas con Firestore Emulator
        working-directory: firebase
        run: npx firebase emulators:exec --project sivap-reglas-prueba --only firestore "npm run test:rules"
