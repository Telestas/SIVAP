name: sivap
description: >-
  SIVAP — captura de datos de un estudio de cohorte clínico.
  App Flutter offline-first para investigadores de campo.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

# Las dependencias se mantienen al mínimo: la app se compila en máquinas con
# conectividad intermitente, y cada paquete es algo que hay que poder descargar.
# Todo lo que hay aquí está por la persistencia cifrada; nada por comodidad.
#
# Las versiones son un punto de partida: `flutter pub get` puede pedir ajustar
# alguna. No fijar versiones exactas a mano sin comprobar que resuelven.
dependencies:
  flutter:
    sdk: flutter

  # SQLite con SQLCipher. `sqlite3` da el acceso; `sqlcipher_flutter_libs`
  # empaqueta la biblioteca nativa que cifra. Sin el segundo, el primero abre
  # bases en claro — por eso la app verifica `PRAGMA cipher_version` al abrir.
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.4

  # Custodia de la clave en el Keystore de Android / Keychain de iOS.
  flutter_secure_storage: ^9.2.2

  # Dónde va el archivo de base de datos en cada plataforma.
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # IBM Plex Sans se distribuye como fuente variable: Flutter la carga y
    # sintetiza los pesos intermedios. Si el equipo quiere los cortes exactos
    # del diseño, se añaden los estáticos y se declaran por peso.
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
